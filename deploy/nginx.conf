# 个人网站 —— Nginx 统一入口
#
# 部署位置： /etc/nginx/conf.d/personal-site.conf
#
# 路由策略（关键）：
#
#   /library/  → Flask :5001   图书管理
#   /ws        → Node  :3000   ESP32 的 WebSocket
#   其它所有   → 先找首页的静态文件；找不到就转发给 Node :3000
#
# 最后一条用 `try_files ... @node` 实现 —— 这样**不用为 Node 的每个文件
# 单独写 location**，也就不会再出现「新加一个页面就 404」的问题。
#
# 为什么踩过坑：首页和机械臂的网页都跑在 URL 根路径下，
# 起初写了个宽泛的正则 location 来缓存首页静态资源，
# 结果把 /app.js、/style.css 一起拦截，害得留言板脚本 404、
# 登录按钮都不渲染。改成「静态优先、找不到再转发」后这类冲突就消失了。

# WebSocket 升级所需的头（用 map 避免普通请求也带 Connection: upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 全站限流：每 IP 每秒 50 个请求，允许 100 个突发
#
# ⚠️ 阈值不能设太低。最初设成 20r/s + 突发 40，结果 50 个并发请求里
#    有 9 个被拒 —— 而且 nginx 默认返回 503，看起来就像服务挂了。
#    一个页面要加载 HTML+CSS+JS+图标约 4 个请求，50r/s 已经足够宽裕，
#    真正要挡的是"每秒几百次"的扫描器。
#
# Node 那边也有应用层限流，这里是更外层的兜底 —— 静态文件不经过 Node，
# 只有这一层能挡住对静态资源的扫描/刷取。
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

# 被限流时返回 429（默认的 503 看起来像服务挂了）
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/personal-site.access.log;
    error_log  /var/log/nginx/personal-site.error.log;

    client_max_body_size 2m;

    # ---------- 安全响应头 ----------
    # 静态文件由 nginx 直接返回，不经过 Node，所以这里必须也加一遍
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;          # 不许被别的站点嵌进 iframe
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 隐藏 nginx 版本号
    server_tokens off;

    # ---------- 拦截自动化扫描器 ----------
    #
    # 实测日志：站点上线当天就被扫了 1143 次 404，全是这类路径 ——
    #   /.env.production  /.git/config  /wp-config.php  /admin/config.php  ...
    # 它们在找"忘删的密钥文件"和"没改默认密码的后台"。
    # 本站在这些路径上本来就没有东西（所以全是 404），
    # 但与其让它们一次次撞 404、刷满日志，不如直接掐断连接。
    #
    # ⚠️ 两点写法上的讲究（都踩过）：
    #   1. 正则**不加 ^/** —— 否则只能匹配"路径开头就是这些词"的，
    #      像 /admin/config.php 这种带前缀的就漏掉了。
    #   2. 这条必须放在下面的隐藏文件规则之前 ——
    #      nginx 的正则 location 是"先匹配到的生效"，顺序反了会被 404 规则截胡。
    #
    # return 444 是 nginx 的特殊写法：不回任何响应，直接关连接。
    # 对扫描器来说这比 404 更"没信息"（连"这个路径存不存在"都判断不了）。
    location ~* (\.env|/\.git|/\.svn|/\.hg|/wp-|wordpress|phpmyadmin|/pma|admin\.php|xmlrpc\.php|config\.(json|php|bak|old)|/backup|/dump|\.sql|\.zip|\.tar\.gz|\.tgz|\.bak|\.old|\.swp) {
        return 444;
    }

    # 其它隐藏文件（.DS_Store 之类）—— 同样不回响应
    location ~ /\. {
        return 444;
    }

    # 首页静态文件的根目录
    root /opt/personal-site/site;
    index index.html;

    # ---------- WebSocket（ESP32 连进来）----------
    # 必须显式声明：@node 那条不带 Upgrade 头，长连接会握手失败
    location ^~ /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 图书管理（Flask）----------
    # proxy_pass 末尾不加 / —— 要把 /library/ 原样透传，
    # 因为 Flask 应用的路由本身带 /library/ 前缀
    location ^~ /library/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 其它一切 ----------
    # 先当作首页的静态文件找（/、/home.css 等）；
    # 找不到就交给 Node（机械臂的页面、/api/*、/login、PWA 资源等）
    location / {
        limit_req zone=general burst=100 nodelay;
        try_files $uri $uri/ @node;
    }

    location @node {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 登录限流靠它识别真实客户端 IP，不能省
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
