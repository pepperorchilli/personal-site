# 个人网站 —— Nginx 统一入口（HTTPS）
#
# 部署位置： /etc/nginx/conf.d/personal-site.conf
#
# 路由：
#   /library/  → Flask :5001   图书管理
#   /ws        → Node  :3000   ESP32 的 WebSocket
#   其它所有   → 先找首页静态文件；找不到就转发给 Node :3000
#
# 证书由 certbot 申请（Let's Encrypt），自动续期已配置。

# WebSocket 升级所需的头
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 全站限流：每 IP 每秒 50 个请求，允许 100 个突发
#
# ⚠️ 阈值不能设太低。最初设成 20r/s + 突发 40，结果 50 个并发请求里
#    有 9 个被拒 —— 而且 nginx 默认返回 503，看起来就像服务挂了。
#    一个页面要加载 HTML+CSS+JS+图标约 4 个请求，50r/s 已经足够宽裕。
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

# 被限流时返回 429（默认的 503 看起来像服务挂了）
limit_req_status 429;

# ================================================================
#  HTTP：只做两件事 —— 放行证书验证、其余全部跳 HTTPS
# ================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt 验证
    # ⚠️ 必须排在跳转之前，否则 CA 拿不到验证文件、续期会失败
    location ^~ /.well-known/acme-challenge/ {
        root /opt/personal-site/site;
        default_type "text/plain";
    }

    # ESP32 的 WebSocket —— 也放行，不跳 HTTPS
    #
    # ⚠️ 关键：ESP32 固件连的是 ws://（明文 WebSocket），
    #    WebSocket 客户端**不跟随 301 重定向** —— 如果这里跳转，
    #    握手会失败、设备掉线（实际踩到过）。
    #    让 /ws 在 80 端口继续可用即可，它是独立的设备通道，
    #    走 token 鉴权，不走网页登录，不涉及用户密码明文传输。
    location ^~ /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余一律跳 HTTPS
    # 写死域名而不是 $host —— 这样用 IP 访问也会跳到证书匹配的域名上，
    # 不会出现"证书与域名不符"的警告
    location / {
        return 301 https://qiudai.site$request_uri;
    }
}

# ================================================================
#  HTTPS：真正干活的地方
# ================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qiudai.site www.qiudai.site;

    # ---------- 证书 ----------
    ssl_certificate     /etc/letsencrypt/live/qiudai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiudai.site/privkey.pem;

    # 只留 TLS 1.2 / 1.3（1.0、1.1 已被认为不安全）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 通知浏览器：以后这个域名只用 HTTPS（6 个月）
    # 注意：确认 HTTPS 稳定后再开，否则期间没法退回 HTTP
    add_header Strict-Transport-Security "max-age=15552000" always;

    access_log /var/log/nginx/personal-site.access.log;
    error_log  /var/log/nginx/personal-site.error.log;

    client_max_body_size 2m;

    # ---------- 安全响应头 ----------
    # 静态文件由 nginx 直接返回、不经过 Node，所以这里必须也加一遍
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;   # 隐藏 nginx 版本号

    # 首页静态文件的根目录
    root /opt/personal-site/site;
    index index.html;

    # ---------- 拦截自动化扫描器 ----------
    # 实测：上线当天被扫 1143 次 404，全是 /.env.production、/.git/config、
    # /wp-config.php 这类"找泄露密钥、找没改密码的后台"的路径。
    # return 444 = 不回任何响应，直接关连接 —— 比 404 更"没信息"。
    #
    # ⚠️ 两处讲究：
    #   1. 正则不锚 ^/ —— 否则 /admin/config.php 这种带前缀的会漏掉
    #   2. 必须排在隐藏文件规则之前（nginx 正则 location 先匹配到的生效）
    location ~* (\.env|/\.git|/\.svn|/\.hg|/wp-|wordpress|phpmyadmin|/pma|admin\.php|xmlrpc\.php|config\.(json|php|bak|old)|/backup|/dump|\.sql|\.zip|\.tar\.gz|\.tgz|\.bak|\.old|\.swp) {
        return 444;
    }

    # 其它隐藏文件（.DS_Store 之类）
    location ~ /\. {
        return 444;
    }

    # ---------- ESP32 的 WebSocket ----------
    # ⚠️ 必须用独立路径 /ws，不能和首页的 / 冲突：
    #    Nginx 无法按请求头区分 location，所以让固件连到 /ws。
    #    服务器只校验 token 不校验路径，所以改路径无需改后端。
    location ^~ /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # WebSocket 是长连接，不参与限流（限流会误伤）
    }

    # ---------- 图书管理（Flask）----------
    # proxy_pass 末尾不加 / —— 要把 /library/ 原样透传，
    # 因为 Flask 应用的路由本身就带 /library/ 前缀
    location ^~ /library/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 其它一切 ----------
    # 先当作首页的静态文件找（/、/home.css 等）；
    # 找不到就交给 Node（机械臂的页面、/api/*、/login、PWA 资源等）
    location / {
        limit_req zone=general burst=100 nodelay;
        try_files $uri $uri/ @node;
    }

    location @node {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 限流靠它识别真实客户端 IP，不能省
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
