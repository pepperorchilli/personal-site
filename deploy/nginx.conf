# 个人网站 —— Nginx 统一入口
#
# 部署位置： /etc/nginx/conf.d/personal-site.conf
#
# 路由策略（关键）：
#
#   /library/  → Flask :5001   图书管理
#   /ws        → Node  :3000   ESP32 的 WebSocket
#   其它所有   → 先找首页的静态文件；找不到就转发给 Node :3000
#
# 最后一条用 `try_files ... @node` 实现 —— 这样**不用为 Node 的每个文件
# 单独写 location**，也就不会再出现「新加一个页面就 404」的问题。
#
# 为什么踩过坑：首页和机械臂的网页都跑在 URL 根路径下，
# 起初写了个宽泛的正则 location 来缓存首页静态资源，
# 结果把 /app.js、/style.css 一起拦截，害得留言板脚本 404、
# 登录按钮都不渲染。改成「静态优先、找不到再转发」后这类冲突就消失了。

# WebSocket 升级所需的头（用 map 避免普通请求也带 Connection: upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 全站限流：每 IP 每秒 20 个请求，允许 40 个突发
# Node 那边也有应用层限流，这里是更外层的兜底 —— 静态文件不经过 Node，
# 只有这一层能挡住对静态资源的扫描/刷取。
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/personal-site.access.log;
    error_log  /var/log/nginx/personal-site.error.log;

    client_max_body_size 2m;

    # ---------- 安全响应头 ----------
    # 静态文件由 nginx 直接返回，不经过 Node，所以这里必须也加一遍
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;          # 不许被别的站点嵌进 iframe
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 隐藏 nginx 版本号
    server_tokens off;

    # 拒绝访问隐藏文件（.git / .env / .DS_Store 之类）
    location ~ /\. {
        deny all;
        return 404;
    }

    # 首页静态文件的根目录
    root /opt/personal-site/site;
    index index.html;

    # ---------- WebSocket（ESP32 连进来）----------
    # 必须显式声明：@node 那条不带 Upgrade 头，长连接会握手失败
    location ^~ /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 图书管理（Flask）----------
    # proxy_pass 末尾不加 / —— 要把 /library/ 原样透传，
    # 因为 Flask 应用的路由本身带 /library/ 前缀
    location ^~ /library/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 其它一切 ----------
    # 先当作首页的静态文件找（/、/home.css 等）；
    # 找不到就交给 Node（机械臂的页面、/api/*、/login、PWA 资源等）
    location / {
        limit_req zone=general burst=40 nodelay;
        try_files $uri $uri/ @node;
    }

    location @node {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 登录限流靠它识别真实客户端 IP，不能省
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
