# 个人网站 —— Nginx 统一入口
#
# 部署位置： /etc/nginx/sites-available/personal-site
# 启用：     ln -s /etc/nginx/sites-available/personal-site /etc/nginx/sites-enabled/
#
# 架构：
#   /          → 静态首页（本仓库的 site/ 目录）
#   /control   → Node :3000   机械臂控制台
#   /set       → Node :3000   机械臂 API（需登录）
#   /messages  → Node :3000   留言板
#   /api/      → Node :3000   留言 API + 登录接口
#   /ws        → Node :3000   ESP32 的 WebSocket 长连接
#   /library/  → Flask :5001  图书管理系统
#
# ⚠️ 所有代理 location 都必须带 ^~ 前缀，原因见文件末尾的说明。

# WebSocket 升级所需的头（用 map 避免普通请求也带上 Connection: upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;          # 用 IP 访问，暂不绑定域名

    access_log /var/log/nginx/personal-site.access.log;
    error_log  /var/log/nginx/personal-site.error.log;

    client_max_body_size 2m;

    # ---------- 首页（静态）----------
    root /opt/personal-site/site;
    index index.html;

    # 首页是单页静态站点，不需要 SPA 回退 ——
    # 用 =404 让打错的地址老老实实报 404，而不是静默显示首页掩盖问题
    location / {
        try_files $uri $uri/ =404;
    }

    # 首页的样式表
    #
    # ⚠️ 故意叫 home.css 而不是 style.css：
    #    机械臂的网页也用 /style.css，两者同处 URL 根路径，会冲突 ——
    #    曾经因此让机械臂页面加载到首页的样式、且 /app.js 返回 404。
    #    唯一化文件名是最省事且不易再错的解法。
    location = /home.css {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- ESP32 的 WebSocket ----------
    # ⚠️ 必须用独立路径 /ws，不能和首页的 / 冲突：
    #    Nginx 无法按请求头区分 location，所以让固件连到 /ws。
    #    服务器只校验 token 不校验路径，所以改路径无需改后端。
    location ^~ /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;      # 长连接，别被超时掐断
        proxy_send_timeout 3600s;
    }

    # ---------- 机械臂（Node）----------
    # 注意 /control 下面有 assets/*.js|css，必须用 ^~ 挡住上面的静态正则，
    # 否则 /control/assets/index-xxx.js 会被当成首页文件去找 → 404
    location ^~ /control {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /set {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /messages {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ⚠️ 必须转发 X-Forwarded-For —— 登录限流要靠它识别真实客户端 IP，
        #    否则所有请求在 Node 眼里都是同一个 IP，一个人失败全员被封
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /download {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /files/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # 机械臂网页的静态资源
    #
    # ⚠️ 这两个文件和首页共用 URL 根路径，必须显式代理到 Node ——
    #    否则 nginx 会去首页目录 /opt/personal-site/site/ 找它们 → 404
    #    （曾因此让留言板页面脚本加载失败、登录按钮都不显示）
    location = /style.css {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location = /app.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location = /manifest.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location ~ ^/icon-\d+\.png$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # ---------- 图书管理（Flask）----------
    # proxy_pass 末尾不加 / —— 要把 /library/ 原样透传，
    # 因为 Flask 应用的路由本身就带 /library/ 前缀
    location ^~ /library/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 接口文档（不想公开就注释掉这一段）----------
    location ^~ /api-docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}

# ================================================================
# 为什么所有代理 location 都带 ^~
# ================================================================
#
# Nginx 的 location 匹配优先级是：
#   1. =  精确匹配
#   2. ^~ 前缀匹配（匹配后**不再**检查正则）
#   3. ~ / ~*  正则匹配
#   4. 普通前缀匹配（最长优先）
#
# 也就是说：**正则 location 的优先级高于普通前缀 location**。
#
# 本文件里有一条正则：
#   location ~* ^/[^/]+\.(css|js|png|...)$   # 首页静态资源缓存
#
# 如果不加 ^~，那么：
#   /control/assets/index-xxx.js  → 命中正则 → 去首页目录找 → 404
#   /library/static/app.js        → 同上 → 404
#
# 结果就是机械臂和图书管理两个模块的样式与脚本全部加载失败。
# 加上 ^~ 后，这些前缀匹配会短路正则，正确地走反向代理。
# ================================================================
